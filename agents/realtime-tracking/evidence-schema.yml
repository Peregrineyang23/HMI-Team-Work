    default_confidence: 0.45
    effort_multiplier: 0.2
  meeting:
    base_weight: 2.0
    default_confidence: 0.55
    effort_multiplier: 0.5
  meeting_summary:
    base_weight: 2.5
    default_confidence: 0.70
    effort_multiplier: 0.7
  drive_document:
    base_weight: 3.0
    default_confidence: 0.65
    effort_multiplier: 0.8
  sheet_or_base_task:
    base_weight: 4.0
    default_confidence: 0.85
    effort_multiplier: 1.0
  jira_issue:
    base_weight: 4.0
    default_confidence: 0.85
    effort_multiplier: 1.0
  jira_transition:
    base_weight: 2.0
    default_confidence: 0.80
    effort_multiplier: 0.5
  local_source_asset:
    base_weight: 2.5
    default_confidence: 0.60
    effort_multiplier: 0.8
  local_render_export:
    base_weight: 2.0
    default_confidence: 0.55
    effort_multiplier: 0.5
  figma_design_file:
    base_weight: 3.0
    default_confidence: 0.70
