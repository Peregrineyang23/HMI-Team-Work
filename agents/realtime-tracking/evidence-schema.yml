confidence_rules:
  project_match:
    exact_project_id_or_jira_key: 0.95
    configured_alias_in_title_or_path: 0.80
    keyword_in_summary_only: 0.55
    folder_context_only: 0.45
  person_match:
    roster_open_id: 0.95
    configured_jira_account: 0.90
    folder_name_or_filename: 0.55
    last_editor_name_only: 0.70
  task_match:
    jira_issue_key: 0.95
    feishu_base_row_id: 0.90
    title_similarity: 0.55

dedupe_rules:
  - 优先使用外部系统稳定 ID，例如 Jira issue id、飞书 message id、drive token、Figma file key。
  - 本地文件使用 absolute_path + modified_at + size_bytes 生成 artifact_id。
  - 同一 artifact 的多次修改保留最新状态，同时把 modified 事件追加到 event 流。
  - 同一会议在 VC 搜索与妙记中重复出现时，以 meeting_id 合并。

score_separation:
  evidence_score:
    definition: 当前系统可见的可追溯证据强度。
    warning: 不能作为绩效分或真实工时。
  estimated_effort:
    definition: 结合 Jira story point、工时报表、任务状态、文件迭代和会议动作项推断的工作量信号。
    warning: 没有工时表或任务系统时仅作方向性估算。
  confidence:
    definition: 归因到项目、人员、任务的可信度。
  manual_adjustment:
    definition: 杨帆或项目 owner 对系统漏算/误算的人工校正。
    audit: 必须保留调整人、时间、原因和影响范围。

