version: 0.5
release_level: PRIVATE
created_at: 2026-07-11
timezone: Asia/Shanghai
purpose: >
  Mainline 2026H1 performance scoring model with explicit recognition
  evidence weighting for Figma, Feishu, Feishu Docs, customer feedback,
  one-pass approval, and manager/master-agent replies.
based_on:
  - agents/performance/performance-score-model-v0.4.yml
  - agents/performance/2026H1-team-calibration/01-unified-data-mining-and-scoring-rules.md
deliverables:
  rules: agents/performance/2026H1-team-calibration/01-unified-data-mining-and-scoring-rules.md
  consolidation: agents/performance/2026H1-three-case-rule-consolidation.md
policy_additions:
  recognition_evidence_weighting_enabled: true
  customer_written_approval_is_high_confidence_quality_evidence: true
  one_pass_approval_requires_review_or_delivery_record: true
  manager_explicit_quality_or_value_reply_is_high_confidence_signal: true
  generic_acknowledgement_is_collaboration_signal_only: true
  likes_and_reactions_raise_confidence_but_do_not_directly_prove_quality: true
  recognition_bonus_must_not_duplicate_base_score: true
source_types:
  - figma_comment
  - figma_reaction
  - feishu_reaction
  - feishu_doc_comment
  - customer_feedback
  - manager_reply
  - one_pass_approval
decision:
  submit_to_mainline_rules: true
  submit_person_specific_mapping_to_public_rules: false
