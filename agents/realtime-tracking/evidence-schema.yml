version: 1
generated_at: 2026-07-07
timezone: Asia/Shanghai

entities:
  Project:
    required: [project_id, name, status]
    fields:
      project_id: stable_slug
      name: display_name
      aliases: keyword_list
      status: active | paused | delivered | unknown
      owner_agent: nullable_agent_id
      domain_refs: domain_codes
      source_refs: evidence_source_ids

  Task:
    required: [task_id, project_id, title, status]
    fields:
      task_id: stable_external_or_generated_id
      project_id: project_id
      title: task_title
      status: todo | doing | review | blocked | done | unknown
      accountable_agent: exactly_one_agent_id_when_assigned
      collaborators: agent_id_list
      source_system: feishu | jira | local | figma | ai_generation | wechat_export | manual
      external_url: nullable_url
      due_at: nullable_datetime
      priority: p0 | p1 | p2 | p3 | unknown
      confidence: 0.0_to_1.0

  Person:
    required: [agent_id, name, status]
    fields:
      agent_id: roster_agent_id
      name: display_name
      open_id: nullable_feishu_open_id
      organization_team: team_id
      status: active | transition | departed
      assignment_policy: assignable | do_not_assign_new_work

  Evidence:
    required: [evidence_id, source_id, evidence_type, observed_at]
    fields:
      evidence_id: deterministic_hash
      source_id: configured_data_source_id
      source_system: feishu | jira | local | figma | ai_generation | wechat_export | manual
      evidence_type: see_evidence_types
      observed_at: datetime
      captured_at: datetime
      project_candidates: list_of_project_confidence
      person_candidates: list_of_person_confidence
      task_candidates: list_of_task_confidence
      artifact_id: nullable_artifact_id
      title: string
      summary: string
      url: nullable_url
      raw_ref: local_path_or_external_id
      dedupe_key: deterministic_string
      evidence_score: visible_evidence_weight
      estimated_effort: nullable_effort_points_or_hours
      confidence: 0.0_to_1.0
      manual_adjustment: nullable_adjustment_record

  Artifact:
    required: [artifact_id, source_system, artifact_type, title]
    fields:
      artifact_id: deterministic_hash
      source_system: feishu | local | figma | ai_generation | manual
      artifact_type: source_asset | render_export | prototype_build | document | board | prompt | unknown
      title: string
      path_or_url: string
      extension: nullable_extension
      size_bytes: nullable_integer
      modified_at: nullable_datetime
      owner_agent: nullable_agent_id
      project_id: nullable_project_id
      version_hint: nullable_string

  Event:
    required: [event_id, event_type, observed_at]
    fields:
      event_id: deterministic_hash
      event_type: created | modified | commented | assigned | status_changed | reviewed | exported | blocked | delivered
      project_id: nullable_project_id
      task_id: nullable_task_id
      actor_agent: nullable_agent_id
      source_system: source_system
      observed_at: datetime
      summary: string
      confidence: 0.0_to_1.0

  EffortEstimate:
    required: [estimate_id, project_id, person_agent_id]
    fields:
      estimate_id: deterministic_hash
      project_id: project_id
      person_agent_id: agent_id
      window_start: date
      window_end: date
      evidence_score: numeric_visible_signal
      estimated_effort: numeric_effort_signal
      manual_adjustment: numeric_adjustment
      confidence: 0.0_to_1.0
      notes: string

