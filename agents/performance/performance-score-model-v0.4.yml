version: 0.4
release_level: PRIVATE
created_at: 2026-07-10
timezone: Asia/Shanghai
purpose: >
  Mainline 2026H1 performance scoring model after consolidating reusable
  rules from Lynn, Abby, and Yuzongli evaluation package audits.
based_on:
  - agents/performance/performance-score-model-v0.3.yml
  - agents/performance/2026H1-lynn-v2-evaluation-audit.md
  - agents/performance/2026H1-abby-evaluation-audit.md
  - agents/performance/2026H1-yuzongli-evaluation-audit.md
  - agents/performance/2026H1-three-case-rule-consolidation.md
deliverables:
  rules: agents/performance/2026H1-team-calibration/01-unified-data-mining-and-scoring-rules.md
  consolidation: agents/performance/2026H1-three-case-rule-consolidation.md
  lynn_v2_audit: agents/performance/2026H1-lynn-v2-evaluation-audit.md
policy_additions:
  score_band_must_match_final_score: true
  keep_evidence_adjusted_and_manager_calibrated_scores_separate: true
  evidence_package_files_must_be_internally_consistent: true
  manual_records_and_mined_metrics_must_be_labeled_separately: true
  count_metrics_are_density_or_complexity_signals_only: true
  local_workflow_evidence_requires_dedupe_and_adoption_status: true
  ai_efficiency_requires_adoption_or_before_after_evidence: true
  shared_file_contribution_requires_role_or_ratio_adjustment: true
  bonus_requires_extra_impact_not_base_duty: true
decision:
  submit_to_mainline_rules: true
  submit_person_specific_scores_to_public_rules: false
  submit_person_specific_mapping_to_public_rules: false
